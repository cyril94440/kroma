[workspace]

[package]
name = "kroma-party"
version = "0.2.4"
edition = "2021"
rust-version = "1.88"
description = "Watch party for the live television: chat, majority votes, polls, reactions, ideas and playback sync"
license = "AGPL-3.0-or-later"

[[bin]]
name = "kroma-module-party"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["storage"] }
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime", features = ["storage"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", features = ["macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "form", "matched-path"] }
kroma-sqlite-guest = { path = "../../../server/crates/kroma-sqlite-guest" }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
debug = false
